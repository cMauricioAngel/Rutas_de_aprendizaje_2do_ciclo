<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curar Fuentes · Rutas de Aprendizaje</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.min.css">
<style>
  :root{
    --bg:#0d1117;--paper:#161b22;--paper2:#21262d;--ink:#e6edf3;--mute:#8b949e;
    --accent:#2f81f7;--accent-soft:#1a3a5c;--green:#3fb950;--yellow:#d29922;
    --red:#f85149;--line:#30363d;--border:rgba(48,54,61,.8);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.5;min-height:100vh}
  .mono{font-family:'JetBrains Mono',monospace}
  .container{max-width:1400px;margin:0 auto;padding:20px}

  /* HEADER */
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
  .top h1{font-size:20px;font-weight:700;letter-spacing:-.5px}
  .top h1 span{color:var(--accent)}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* CONTROLS */
  .controls{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .controls select,.controls input[type=text]{
    background:var(--paper2);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:8px 10px;font-family:inherit;font-size:12px;outline:none;
  }
  .controls select:focus,.controls input:focus{border-color:var(--accent)}
  .controls label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}

  /* STATS */
  .stats{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:120px}
  .stat .num{font-size:24px;font-weight:800}
  .stat .lbl{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:1px}
  .stat .num.green{color:var(--green)}.stat .num.yellow{color:var(--yellow)}.stat .num.blue{color:var(--accent)}

  /* TABLE */
  .table-wrap{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead{position:sticky;top:0;z-index:1}
  th{background:var(--paper2);text-align:left;padding:10px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);border-bottom:1px solid var(--line)}
  td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:hover td{background:rgba(47,129,247,.05)}

  .ref-title{font-weight:600;color:var(--ink);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ref-meta{font-size:11px;color:var(--mute)}
  .ref-source{font-size:11px;color:var(--accent)}

  .url-input{
    width:100%;background:var(--paper2);color:var(--ink);border:1px solid var(--line);
    border-radius:4px;padding:5px 8px;font-family:inherit;font-size:11px;outline:none;
  }
  .url-input:focus{border-color:var(--accent)}
  .url-input.filled{border-color:var(--green)}

  .btn{
    background:var(--paper2);color:var(--ink);border:1px solid var(--line);
    border-radius:4px;padding:5px 10px;font-family:inherit;font-size:10px;
    cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;
    transition:background .15s,border-color .15s;white-space:nowrap;
  }
  .btn:hover{background:var(--accent-soft);border-color:var(--accent)}
  .btn.yt{color:#ff4444}.btn.yt:hover{background:rgba(255,68,68,.15);border-color:#ff4444}
  .btn.g{color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-bright)}
  .btn.save{background:var(--green);color:#000;border-color:var(--green)}

  .badge{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .badge.pendiente{background:rgba(210,153,34,.15);color:var(--yellow)}
  .badge.verificado{background:rgba(63,185,80,.15);color:var(--green)}
  .badge.sugerido{background:rgba(47,129,247,.15);color:var(--accent)}
  .badge.no_existe{background:rgba(248,81,73,.15);color:var(--red)}

  .mapa-tag{font-size:10px;color:var(--mute);background:var(--paper2);padding:2px 6px;border-radius:3px}

  .drop-zone{
    border:2px dashed var(--line);border-radius:12px;padding:60px 20px;text-align:center;
    margin-bottom:20px;cursor:pointer;transition:border-color .2s,background .2s;
  }
  .drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(47,129,247,.05)}
  .drop-zone p{color:var(--mute);font-size:14px;margin-top:8px}
  .drop-zone .big{font-size:48px;opacity:.3}

  .hidden{display:none!important}
  .footer-actions{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);margin-top:16px;display:flex;gap:10px;justify-content:flex-end;align-items:center;z-index:10}
  .footer-actions .count{font-size:12px;color:var(--mute);margin-right:auto}
</style>
</head>
<body>
<div class="container">

  <div class="top">
    <h1>⚗️ Curar <span>Fuentes</span></h1>
    <div class="top-actions">
      <input type="file" id="fileInput" accept=".csv" class="hidden">
      <button class="btn" onclick="document.getElementById('fileInput').click()">📂 Cargar CSV</button>
      <button class="btn primary" id="exportBtn" onclick="exportCSV()" disabled>💾 Exportar CSV curado</button>
      <button class="btn save" id="applyBtn" onclick="applyAndExport()" disabled>🚀 Exportar + instrucciones</button>
    </div>
  </div>

  <!-- DROP ZONE -->
  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="big">📄</div>
    <p><b>Carga <code>data/referencias_curadas.csv</code></b><br>
    Arrastra el archivo aquí o haz clic para seleccionarlo</p>
  </div>

  <!-- CONTROLS -->
  <div class="controls hidden" id="controls">
    <label>Mapa</label>
    <select id="fMapa" onchange="render()"><option value="">Todos</option></select>
    <label>Sección</label>
    <select id="fSeccion" onchange="render()">
      <option value="">Todas</option>
      <option value="Videos">🎥 Videos</option>
      <option value="Bibliografía">📚 Biblio</option>
      <option value="Práctica">⚡ Práctica</option>
    </select>
    <label>Estado</label>
    <select id="fEstado" onchange="render()">
      <option value="">Todos</option>
      <option value="pendiente">⏳ Pendiente</option>
      <option value="sugerido">💡 Sugerido</option>
      <option value="verificado">✅ Verificado</option>
    </select>
    <label>Buscar</label>
    <input type="text" id="fText" placeholder="Filtrar por título..." oninput="render()" style="min-width:200px">
  </div>

  <!-- STATS -->
  <div class="stats hidden" id="stats"></div>

  <!-- TABLE -->
  <div class="table-wrap hidden" id="tableWrap">
    <table>
      <thead><tr>
        <th>Mapa</th><th>Ref</th><th>Buscar</th><th>URL final</th><th>Estado</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footer-actions hidden" id="footer">
    <span class="count" id="footerCount"></span>
    <button class="btn primary" onclick="exportCSV()">💾 Exportar CSV</button>
  </div>

</div>

<script>
let ROWS = [];
const $ = id => document.getElementById(id);

/* ---------- cargar CSV ---------- */
$('fileInput').addEventListener('change', e => { if(e.target.files[0]) loadFile(e.target.files[0]); });
$('dropZone').addEventListener('dragover', e => { e.preventDefault(); $('dropZone').classList.add('dragover'); });
$('dropZone').addEventListener('dragleave', () => $('dropZone').classList.remove('dragover'));
$('dropZone').addEventListener('drop', e => { e.preventDefault(); $('dropZone').classList.remove('dragover'); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => { parseCSV(e.target.result); };
  reader.readAsText(file);
}

function parseCSV(text) {
  ROWS = [];
  let row = [], field = '', inQ = false;
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for (let i=0;i<text.length;i++){
    const ch = text[i];
    if (inQ){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false;} else field+=ch; }
    else { if(ch==='"') inQ=true; else if(ch===','){row.push(field);field='';} else if(ch==='\n'){row.push(field);field='';ROWS.push(row);row=[];} else field+=ch; }
  }
  if(field||row.length){row.push(field);ROWS.push(row);}
  const headers = ROWS.shift();
  ROWS = ROWS.filter(r=>r.length>1||r[0]).map(r=>{const o={};headers.forEach((h,j)=>o[h]=r[j]||'');return o;});
  initUI();
}

/* ---------- init ---------- */
function initUI(){
  $('dropZone').classList.add('hidden');
  ['controls','stats','tableWrap','footer'].forEach(id=>$(id).classList.remove('hidden'));
  // llenar filtro de mapas
  const mapas = [...new Set(ROWS.map(r=>r.mapa))].sort();
  const sel = $('fMapa');
  mapas.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m.replace('Mapa_','').replace('.html','');sel.appendChild(o);});
  $('exportBtn').disabled=false; $('applyBtn').disabled=false;
  render();
}

/* ---------- stats ---------- */
function updateStats(){
  const total=ROWS.length;
  const ver=ROWS.filter(r=>r.estado==='verificado').length;
  const sug=ROWS.filter(r=>r.estado==='sugerido').length;
  const pend=ROWS.filter(r=>r.estado==='pendiente').length;
  const withUrl=ROWS.filter(r=>(r.url_final||'').trim().startsWith('http')).length;
  $('stats').innerHTML = `
    <div class="stat"><div class="num blue">${total}</div><div class="lbl">Total</div></div>
    <div class="stat"><div class="num green">${ver}</div><div class="lbl">Verificados</div></div>
    <div class="stat"><div class="num yellow">${pend}</div><div class="lbl">Pendientes</div></div>
    <div class="stat"><div class="num blue">${withUrl}</div><div class="lbl">Con URL</div></div>
  `;
}

/* ---------- render tabla ---------- */
function getFiltered(){
  const m=$('fMapa').value, s=$('fSeccion').value, st=$('fEstado').value, t=$('fText').value.toLowerCase();
  return ROWS.filter(r =>
    (!m || r.mapa===m) &&
    (!s || r.seccion===s) &&
    (!st || r.estado===st) &&
    (!t || (r.titulo_visible||'').toLowerCase().includes(t) || (r.autor_canal||'').toLowerCase().includes(t))
  );
}

function render(){
  updateStats();
  const rows = getFiltered();
  const tb = $('tbody');
  tb.innerHTML = '';
  rows.forEach(r => {
    const tr = document.createElement('tr');
    const isVideo = r.seccion === 'Videos';
    const searchQ = encodeURIComponent((r.titulo_visible||'') + ' ' + (r.autor_canal||''));
    const ytUrl = `https://www.youtube.com/results?search_query=${searchQ}`;
    const gUrl = `https://www.google.com/search?q=${searchQ}`;
    const hasUrl = (r.url_final||'').trim().startsWith('http');

    tr.innerHTML = `
      <td><span class="mapa-tag">${(r.mapa||'').replace('Mapa_','').replace('.html','')}</span></td>
      <td>
        <div class="ref-title" title="${esc(r.titulo_visible)}">${esc(r.titulo_visible||'')}</div>
        <div class="ref-meta">${esc(r.autor_canal||'')} ${r.cita?'· '+esc(r.cita.slice(0,60)):''}</div>
      </td>
      <td style="white-space:nowrap">
        ${isVideo?`<a class="btn yt" href="${ytUrl}" target="_blank">▶ YT</a>`:`<a class="btn g" href="${gUrl}" target="_blank">G</a>`}
        <a class="btn g" href="${gUrl}" target="_blank" style="margin-top:2px">🔍</a>
      </td>
      <td style="min-width:280px">
        <input class="url-input ${hasUrl?'filled':''}" type="text"
          placeholder="https://..." value="${esc(r.url_final||'')}"
          data-id="${esc(r.id)}"
          onchange="onUrlChange(this)"
          onpaste="setTimeout(()=>onUrlChange(this),0)">
      </td>
      <td><span class="badge ${r.estado||'pendiente'}">${r.estado||'pendiente'}</span></td>
    `;
    tb.appendChild(tr);
  });
  $('footerCount').textContent = `${rows.length} de ${ROWS.length} refs mostradas · ${ROWS.filter(r=>(r.url_final||'').trim().startsWith('http')).length} con URL`;
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- cuando el usuario pega una URL ---------- */
function onUrlChange(input){
  const id = input.dataset.id;
  const url = input.value.trim();
  const row = ROWS.find(r=>r.id===id);
  if(!row) return;
  row.url_final = url;
  if(url.startsWith('http')){
    row.estado = 'verificado';
    input.classList.add('filled');
  } else {
    input.classList.remove('filled');
  }
  updateStats();
}

/* ---------- exportar CSV ---------- */
function exportCSV(){
  if(!ROWS.length) return;
  const cols = Object.keys(ROWS[0]);
  const lines = [cols.join(',')];
  ROWS.forEach(r => {
    lines.push(cols.map(c => {
      let v = r[c]||'';
      if(/[",\n\r]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
      return v;
    }).join(','));
  });
  const blob = new Blob([lines.join('\n')+'\n'], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'referencias_curadas.csv';
  a.click();
}

function applyAndExport(){
  exportCSV();
  alert('✅ CSV exportado.\n\nPara integrar a los mapas, ejecuta:\n  node scripts/curar_fuentes.mjs --verificar\n\nEl script verificará las URLs y las aplicará al HTML automáticamente.');
}
</script>
</body>
</html>
