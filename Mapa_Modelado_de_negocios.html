<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODELO DE NEGOCIOS // RUTA BPM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/oswald@5.0.0/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/roboto-condensed@5.0.0/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.0/index.css">
    <style>
        :root {
            --bg-crema: #F4EFE9;
            --bg-crema-dark: #E8DFD3;
            --text-antracita: #333333;
            --accent-esmeralda: #0F3D2E;
            --accent-esmeralda-light: #1a6b4f;
            --grid-major: #c9bfb0;
            --grid-minor: #e0d8cc;
            --border-hard: #1a1a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-crema);
            color: var(--text-antracita);
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
            font-feature-settings: "ss01", "cv11";
            /* Papel milimetrado: doble grid (mayor 100px, menor 20px) */
            background-image:
                linear-gradient(var(--grid-major) 1.5px, transparent 1.5px),
                linear-gradient(90deg, var(--grid-major) 1.5px, transparent 1.5px),
                linear-gradient(var(--grid-minor) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            background-attachment: fixed;
        }

        /* WCAG AAA - Foco verde esmeralda 3px */
        *:focus-visible {
            outline: 3px solid var(--accent-esmeralda);
            outline-offset: 4px;
            background: rgba(15, 61, 46, 0.06);
        }

        a {
            color: var(--accent-esmeralda);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid var(--accent-esmeralda);
        }
        a:hover { background: var(--accent-esmeralda); color: var(--bg-crema); }

        /* ====== MARCAS DE MEDICIÓN LATERALES ====== */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 18px;
            height: 100vh;
            background-image: repeating-linear-gradient(
                to bottom,
                var(--text-antracita) 0,
                var(--text-antracita) 2px,
                transparent 2px,
                transparent 20px
            );
            opacity: 0.25;
            z-index: 1;
            pointer-events: none;
        }

        /* ====== HEADER ====== */
        .header-structure {
            position: relative;
            background: var(--text-antracita);
            color: var(--bg-crema);
            padding: 3.5rem 2rem 5rem;
            clip-path: polygon(0 0, 100% 0, 100% 78%, 82% 100%, 0 100%);
            margin-bottom: 3rem;
            border-bottom: 6px solid var(--accent-esmeralda);
        }

        .header-structure::after {
            content: "BPMN // CANVAS // ARCH";
            position: absolute;
            top: 1rem; right: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 3px;
            opacity: 0.55;
            color: var(--bg-crema);
        }

        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 2.5rem;
            padding-right: 14rem;
        }

        .header-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-esmeralda-light);
            margin-bottom: 0.75rem;
            padding-left: 2px;
            border-left: 3px solid var(--accent-esmeralda-light);
            padding: 2px 0 2px 10px;
        }

        .course-title {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: -1px;
        }
        .course-title span {
            display: block;
            color: var(--accent-esmeralda-light);
        }

        .course-subtitle {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.85;
            margin-top: 1rem;
            max-width: 480px;
            border-top: 1px solid rgba(244,239,233,0.3);
            padding-top: 1rem;
        }

        /* ====== INDICADOR GLOBAL KPI ====== */
        .global-progress-container {
            background: var(--bg-crema);
            color: var(--text-antracita);
            border: 4px solid var(--bg-crema);
            padding: 1.5rem 1.75rem;
            clip-path: polygon(0 0, 100% 0, 100% 70%, 92% 100%, 0 100%);
            min-width: 340px;
            box-shadow: 10px 10px 0 var(--accent-esmeralda);
            position: relative;
        }

        .global-progress-container::before {
            content: "KPI // GLOBAL";
            position: absolute;
            top: -12px; left: 14px;
            background: var(--accent-esmeralda);
            color: var(--bg-crema);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 2px;
            padding: 3px 8px;
        }

        .global-progress-label {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .global-progress-bar {
            height: 18px;
            background: var(--bg-crema);
            border: 2px solid var(--text-antracita);
            overflow: hidden;
            position: relative;
        }

        .global-progress-fill {
            height: 100%;
            background: var(--accent-esmeralda);
            width: 0%;
            transition: width 0.4s ease;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 6px,
                rgba(244,239,233,0.15) 6px,
                rgba(244,239,233,0.15) 12px
            );
        }

        .global-percent {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 0.75rem;
            font-family: 'Oswald', sans-serif;
        }

        .global-percent .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-esmeralda);
            line-height: 1;
        }

        .global-percent .label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        /* ====== MAIN ====== */
        .main-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 2;
        }

        /* ====== UNIDAD (ACORDEÓN) ====== */
        .unit-accordion {
            border: 4px solid var(--border-hard);
            margin-bottom: 2.5rem;
            background: var(--bg-crema);
            box-shadow: 12px 12px 0 var(--border-hard);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            position: relative;
        }

        .unit-accordion::before {
            content: "";
            position: absolute;
            top: 0; right: 0;
            width: 40px; height: 40px;
            background: var(--accent-esmeralda);
            clip-path: polygon(100% 0, 0 0, 100% 100%);
            z-index: 3;
        }

        .unit-accordion:hover {
            transform: translate(-3px, -3px);
            box-shadow: 15px 15px 0 var(--accent-esmeralda);
        }

        .unit-header {
            background: var(--text-antracita);
            color: var(--bg-crema);
            padding: 1.75rem 2rem;
            cursor: pointer;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 2rem;
            user-select: none;
            position: relative;
        }

        .unit-number {
            font-family: 'Oswald', sans-serif;
            font-size: 4.5rem;
            font-weight: 700;
            line-height: 0.8;
            color: var(--accent-esmeralda-light);
            letter-spacing: -2px;
            border-right: 3px solid var(--accent-esmeralda-light);
            padding-right: 1rem;
            min-width: 90px;
        }

        .unit-info h2 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 1.6rem;
            letter-spacing: 1px;
            line-height: 1.1;
            font-weight: 500;
        }

        .unit-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            opacity: 0.85;
            margin-top: 0.75rem;
            display: flex;
            gap: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .unit-meta span::before {
            content: "// ";
            color: var(--accent-esmeralda-light);
            font-weight: bold;
        }

        .unit-progress-mini {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
            min-width: 140px;
        }

        .mini-bar-bg {
            width: 130px;
            height: 10px;
            background: rgba(244, 239, 233, 0.15);
            border: 2px solid var(--bg-crema);
        }

        .mini-bar-fill {
            height: 100%;
            background: var(--accent-esmeralda-light);
            width: 0%;
            transition: width 0.3s;
        }

        .mini-percent {
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--bg-crema);
        }

        .toggle-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: var(--accent-esmeralda);
            color: var(--bg-crema);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: bold;
            transition: transform 0.3s, background 0.2s;
            margin-left: 1rem;
        }

        .unit-accordion.active .toggle-icon {
            transform: rotate(45deg);
            background: var(--bg-crema);
            color: var(--accent-esmeralda);
        }

        .unit-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .unit-accordion.active .unit-content {
            max-height: 8000px;
        }

        .subtopics-grid {
            padding: 2.5rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            background: 
                linear-gradient(rgba(15,61,46,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15,61,46,0.04) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* ====== CELDA DE SUBTEMA (EFECTO LUPA) ====== */
        .subtopic-cell {
            border: 3px solid var(--border-hard);
            background: var(--bg-crema);
            position: relative;
            transition: transform 0.25s ease, z-index 0s, box-shadow 0.25s ease;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
        }

        /* EFECTO LUPA: zoom + sombra + borde verde */
        .subtopic-cell:hover {
            transform: scale(1.025);
            z-index: 20;
            box-shadow: 0 0 0 4px var(--accent-esmeralda), 10px 10px 0 var(--border-hard);
            border-color: var(--accent-esmeralda);
        }

        .subtopic-header {
            padding: 1.5rem 1.75rem;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1.5rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: background 0.2s, border-color 0.2s;
        }

        .subtopic-header:hover {
            background: rgba(15, 61, 46, 0.06);
        }

        .subtopic-accordion.active .subtopic-header {
            border-bottom-color: var(--accent-esmeralda);
            background: rgba(15, 61, 46, 0.04);
        }

        .subtopic-title {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            min-width: 0;
        }

        .subtopic-number {
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            color: var(--accent-esmeralda);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -1px;
            border-right: 3px solid var(--accent-esmeralda);
            padding-right: 1rem;
            min-width: 70px;
        }

        .subtopic-name {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 1.15rem;
            color: var(--text-antracita);
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .subtopic-controls {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            flex-shrink: 0;
        }

        /* Checkbox Brutalista */
        .completion-checkbox {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            padding: 6px 10px;
            border: 2px solid var(--border-hard);
            background: var(--bg-crema);
            transition: background 0.2s, color 0.2s;
        }

        .completion-checkbox:hover {
            background: var(--text-antracita);
            color: var(--bg-crema);
        }

        .completion-checkbox input {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid currentColor;
            background: transparent;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }

        .completion-checkbox input:checked {
            background: var(--accent-esmeralda);
            border-color: var(--accent-esmeralda);
        }

        .completion-checkbox:has(input:checked) {
            background: var(--accent-esmeralda);
            color: var(--bg-crema);
            border-color: var(--accent-esmeralda);
        }

        .completion-checkbox input:checked::after {
            content: '';
            position: absolute;
            top: 0px;
            left: 3px;
            width: 4px;
            height: 8px;
            border: solid var(--bg-crema);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .subtopic-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--text-antracita);
            color: var(--bg-crema);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            transition: transform 0.3s, background 0.2s;
        }

        .subtopic-accordion.active .subtopic-toggle {
            transform: rotate(180deg);
            background: var(--accent-esmeralda);
        }

        .subtopic-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .subtopic-accordion.active .subtopic-body {
            max-height: 3000px;
        }

        .subtopic-inner {
            padding: 2rem;
            border-top: 2px dashed var(--text-antracita);
        }

        .objective-box {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--bg-crema-dark);
            border-left: 6px solid var(--accent-esmeralda);
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
        }

        .objective-box::before {
            content: "OBJETIVO DE APRENDIZAJE";
            position: absolute;
            top: -12px; left: 0;
            background: var(--accent-esmeralda);
            color: var(--bg-crema);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 2px;
            padding: 3px 10px;
            font-weight: bold;
        }

        .objective-label { display: none; }

        .objective-text {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 0.5rem;
            color: var(--text-antracita);
        }

        /* ====== RECURSOS GRID ====== */
        .resources-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .resource-col {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            border: 2px solid var(--border-hard);
            padding: 1rem;
            background: var(--bg-crema);
            position: relative;
        }

        .resource-col::before {
            content: "";
            position: absolute;
            top: -2px; left: -2px;
            width: 12px; height: 12px;
            background: var(--accent-esmeralda);
        }

        .resource-col:nth-child(2)::before { background: var(--text-antracita); }
        .resource-col:nth-child(3)::before { background: var(--accent-esmeralda-light); }

        .resource-title {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            font-size: 0.95rem;
            border-bottom: 3px solid var(--text-antracita);
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .resource-item {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            padding: 0.6rem 0.5rem 0.6rem 0.75rem;
            border-left: 3px solid var(--grid-major);
            transition: border-color 0.2s, background 0.2s;
            line-height: 1.45;
        }

        .resource-item:hover {
            border-left-color: var(--accent-esmeralda);
            background: rgba(15, 61, 46, 0.04);
        }

        .resource-item strong {
            display: block;
            color: var(--text-antracita);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .resource-item em {
            color: var(--accent-esmeralda);
            font-style: normal;
            font-weight: 600;
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ====== SVG ICONS (Líneas rectas 3px, sin curvas) ====== */
        .svg-icon {
            stroke: currentColor;
            stroke-width: 3px;
            fill: none;
            stroke-linecap: square;
            stroke-linejoin: miter;
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        /* ====== FOOTER ====== */
        .footer {
            margin-top: 5rem;
            padding: 3rem 2rem 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-antracita);
            clip-path: polygon(0 30%, 100% 0, 100% 100%, 0 100%);
            background: var(--text-antracita);
            color: var(--bg-crema);
            border-top: 6px solid var(--accent-esmeralda);
            position: relative;
        }

        .footer-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer::before {
            content: "END // FILE";
            position: absolute;
            top: 1rem; right: 2rem;
            opacity: 0.5;
        }

        /* ====== RESPONSIVE ====== */
        @media (max-width: 960px) {
            .resources-grid { grid-template-columns: 1fr; }
            .unit-header { grid-template-columns: 1fr auto; }
            .unit-number { display: none; }
            .unit-progress-mini { grid-column: 1 / -1; flex-direction: row; align-items: center; }
            .header-content { padding-right: 1rem; }
            .subtopic-header { grid-template-columns: 1fr auto; }
            .subtopic-title { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .subtopic-number { border-right: none; border-bottom: 3px solid var(--accent-esmeralda); padding-right: 0; padding-bottom: 4px; min-width: auto; }
        }

        @media (max-width: 600px) {
            .header-structure { padding: 2rem 1rem 4rem; }
            .subtopics-grid { padding: 1.25rem; }
            .subtopic-inner { padding: 1.25rem; }
            body::before { display: none; }
        }

        /* Animación de entrada */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .unit-accordion { animation: slideIn 0.4s ease backwards; }
        .unit-accordion:nth-child(1) { animation-delay: 0.05s; }
        .unit-accordion:nth-child(2) { animation-delay: 0.1s; }
        .unit-accordion:nth-child(3) { animation-delay: 0.15s; }
        .unit-accordion:nth-child(4) { animation-delay: 0.2s; }
    </style>
</head>
<body>

    <script src="./barra-nav.js" defer></script>
    <header class="header-structure">
        <div class="header-content">
            <div>
                <div class="header-tag">Ruta de Aprendizaje · 16 Semanas · 114 Horas</div>
                <h1 class="course-title">Modelado<span>de Negocios</span></h1>
                <p class="course-subtitle">Gestión por Procesos (BPM) & Automatización Arquitectónica — Blueprint Instruccional</p>
            </div>
            <div class="global-progress-container">
                <div class="global-progress-label">Progreso General del Curso</div>
                <div class="global-progress-bar">
                    <div class="global-progress-fill" id="globalProgress"></div>
                </div>
                <div class="global-percent">
                    <span class="value" id="globalText">0%</span>
                    <span class="label">Completado</span>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container" id="syllabusContainer">
        <!-- JS inyecta unidades -->
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <p>Diseño Instruccional & Arquitectura UI/UX</p>
            <p>Gestión de Procesos BPM · 2026</p>
        </div>
    </footer>

    <script>
        const syllabusData = [
            {
                id: 'u1',
                title: 'Definiciones y Conceptos Importantes sobre BPM',
                hours: 28,
                weeks: 'Semanas 1 a 4',
                subtopics: [
                    {
                        id: '1.1',
                        title: 'Introducción a la gestión por procesos (BPM)',
                        objective: 'Comprender los fundamentos de la Gestión de Procesos de Negocio (BPM) y su valor estratégico en las organizaciones.',
                        theory: [
                            { title: 'What is Business Process Management (BPM)?', channel: 'Bizagi' },
                            { title: 'Business Process Management (BPM) Introduction', channel: 'BPMN University' },
                            { title: 'Introduction to Business Process Management', channel: 'Signavio' },
                            { title: 'BPM Fundamentals: Overview', channel: 'AIIM' }

                                        <h4 class="resource-title">${icons.book} Bibliografía</h4>
                                        ${biblioHTML}
                                    </div>
                                    <div class="resource-col">
                                        <h4 class="resource-title">${icons.funnel} Práctica</h4>
                                        ${practiceHTML}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            const unitIndex = String(idx + 1).padStart(2, '0');

            unitEl.innerHTML = `
                <div class="unit-header" role="button" tabindex="0" aria-expanded="false" aria-controls="content-${unit.id}">
                    <div class="unit-number">${unitIndex}</div>
                    <div class="unit-info">
                        <h2>Unidad ${unitIndex} · ${unit.title}</h2>
                        <div class="unit-meta">
                            <span>Carga: ${unit.hours}h</span>
                            <span>${unit.weeks}</span>
                            <span>${unit.subtopics.length} subtemas</span>
                        </div>
                    </div>
                    <div class="unit-progress-mini">
                        <span class="mini-percent" id="text-${unit.id}">0%</span>
                        <div class="mini-bar-bg"><div class="mini-bar-fill" id="progress-${unit.id}"></div></div>
                        <span class="toggle-icon" aria-hidden="true">+</span>
                    </div>
                </div>
                <div class="unit-content" id="content-${unit.id}">
                    <div class="subtopics-grid">
                        ${subtopicsHTML}
                    </div>
                </div>
            `;
            container.appendChild(unitEl);
        });

        document.querySelectorAll('.unit-header').forEach(header => {
            const toggleUnit = () => {
                const unit = header.parentElement;
                const content = unit.querySelector('.unit-content');
                unit.classList.toggle('active');
                const isActive = unit.classList.contains('active');
                header.setAttribute('aria-expanded', isActive);
                if (isActive) {
                    content.style.maxHeight = content.scrollHeight + "px";
                } else {
                    content.style.maxHeight = "0";
                }
            };
            header.addEventListener('click', toggleUnit);
            header.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleUnit(); }
            });
        });

        document.querySelectorAll('.subtopic-header').forEach(header => {
            const toggleSub = () => {
                const sub = header.parentElement;
                const body = sub.querySelector('.subtopic-body');
                sub.classList.toggle('active');
                const isActive = sub.classList.contains('active');
                header.setAttribute('aria-expanded', isActive);
                if (isActive) {
                    body.style.maxHeight = body.scrollHeight + "px";
                    setTimeout(() => {
                        const unitContent = sub.closest('.unit-content');
                        if (unitContent.style.maxHeight !== '0px') {
                            unitContent.style.maxHeight = unitContent.scrollHeight + "px";
                        }
                    }, 400);
                } else {
                    body.style.maxHeight = "0";
                    setTimeout(() => {
                        const unitContent = sub.closest('.unit-content');
                        if (unitContent.style.maxHeight !== '0px') {
                            unitContent.style.maxHeight = unitContent.scrollHeight + "px";
                        }
                    }, 400);
                }
            };
            header.addEventListener('click', toggleSub);
            header.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSub(); }
            });
        });

        function updateProgress() {
            let totalChecked = 0;
            syllabusData.forEach(unit => {
                const checks = document.querySelectorAll(`input[data-unit="${unit.id}"]:checked`);
                const percent = Math.round((checks.length / unit.subtopics.length) * 100);
                document.getElementById(`progress-${unit.id}`).style.width = percent + '%';
                document.getElementById(`text-${unit.id}`).innerText = percent + '%';
                totalChecked += checks.length;
            });
            const globalPercent = Math.round((totalChecked / totalCheckboxes) * 100);
            document.getElementById('globalProgress').style.width = globalPercent + '%';
            document.getElementById('globalText').innerText = globalPercent + '%';
        }

        updateProgress();
    </script>
</body>
</html>
